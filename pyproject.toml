[project]
name = "anchor"
version = "0.1.0"
description = "Anchor real estate acquisition analysis proof of concept"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.60",
    # Phase 10A ingestion (KTD6): Azure DI non-generative extraction layer (KD1).
    "azure-ai-documentintelligence>=1.0",
    # Phase 10A ingestion (KTD6): required by FastAPI's UploadFile/File() parsing,
    # which no existing endpoint uses. Pinned >=0.0.18 -- 0.0.14-0.0.15 shipped an
    # import-namespace break.
    "python-multipart>=0.0.18",
    # Phase 10A ingestion (KTD6): enforces the KTD9 page-count ceiling locally,
    # before any (paid) Azure DI call is made.
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Windows: the OS-global, username-keyed pytest-of-<user> temp base can collide
# across distinct Windows accounts that resolve to the same username string
# (e.g. a sandboxed execution account vs. the interactive account), leaving one
# principal locked out with PermissionError: [WinError 5]. Route tmp_path/tmpdir
# to a repo-local, gitignored directory instead so Anchor's tests never depend
# on that shared machine-global path. See testing-conventions-and-architecture-
# guardrails.md item 7 for the confirmed root cause.
addopts = "--basetemp=.pytest-temp"

[project]
name = "mini-anchor"
version = "0.1.0"
description = "Mini-Anchor real estate acquisition analysis proof of concept"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
